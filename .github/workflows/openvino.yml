name: OpenVINO Backend Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      artifact_name:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl binutils python3-pip
          pip3 install meson==1.3.2
          meson --version
      - name: Install OpenVINO Runtime
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/intel-openvino.gpg
          echo "deb [signed-by=/usr/share/keyrings/intel-openvino.gpg] https://apt.repos.intel.com/openvino ubuntu24 main" \
            | sudo tee /etc/apt/sources.list.d/intel-openvino.list
          sudo apt-get update
          sudo apt-get install -y openvino
          # The apt package installs under /opt/intel/openvino-<ver>; the
          # /opt/intel/openvino symlink points at the latest.
          echo "/opt/intel/openvino/runtime/lib/intel64" \
            | sudo tee /etc/ld.so.conf.d/openvino.conf
          sudo ldconfig
      - name: Configure Meson and Build OpenVINO
        run: |
          meson setup --buildtype release build \
            -Dopenvino=true \
            -Dopenvino_include=/opt/intel/openvino/runtime/include \
            -Dopenvino_libdirs=/opt/intel/openvino/runtime/lib/intel64 \
            -Dgtest=true \
            --clearcache
          ninja -C build -v
      - name: Run OpenVINO KDA Scan Test
        if: success()
        run: meson test -C build OpenVinoKdaScan --print-errorlogs
      - name: Upload Meson Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: build-logs-${{ inputs.artifact_name }}
          path: build
      - name: Upload a Build Artifact
        if: success()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: lc0-${{ inputs.artifact_name }}
          path: build/lc0
